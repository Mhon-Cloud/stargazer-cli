name: Release

# Push a tag like v0.2.0 (matching Cargo.toml's version; v0.2.0-rc.1 makes a pre-release) to:
#   check the version -> test -> build every target -> publish a GitHub release (with build provenance)
#   -> install the published release with install.sh / install.ps1 on Linux, macOS and Windows.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

  test:
    needs: check-version
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stargazer-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Build provenance (verify with `gh attestation verify <file> -R Mhon-Cloud/stargazer-cli`)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  verify-install:
    # What a user does: run the install script for this release, then the binary.
    name: verify-install (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STARGAZER_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          export STARGAZER_INSTALL_DIR="$RUNNER_TEMP/stargazer-bin"
          sh install.sh
          out="$("$STARGAZER_INSTALL_DIR/stargazer" version --output json)"
          echo "$out"
          echo "$out" | grep -q "\"version\":\"${GITHUB_REF_NAME#v}\""
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STARGAZER_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "stargazer-bin"
          ./install.ps1
          $v = & (Join-Path $env:STARGAZER_INSTALL_DIR "stargazer.exe") version --output json | ConvertFrom-Json
          if ($v.version -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw "installed $($v.version), expected $env:GITHUB_REF_NAME" }
          Write-Host "installed $($v.version) ($($v.os) $($v.arch))"
