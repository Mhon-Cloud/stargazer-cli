name: CI

# Every push to main and every PR: test, then build every release target. The binaries are attached to the run
# (Actions -> the run -> Artifacts) for trying a change before it's released.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml
