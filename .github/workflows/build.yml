name: Build

# Release binaries for every target, smoke-tested where the runner can run them, packaged exactly as a release ships
# them (see docs/releasing.md). Called by ci.yml (so a broken target shows up in the PR, not at tag time) and
# release.yml (whose publish job uploads these archives).
on:
  workflow_call:
    inputs:
      retention-days:
        description: How long the artifacts are kept
        type: number
        default: 7

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true, smoke: false }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cross: false, smoke: true }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      USE_CROSS: ${{ matrix.cross }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          bin="target/$TARGET/release/stargazer"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help > /dev/null
          out="$("$bin" version --output json)"
          echo "$out"
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "$out" | grep -q "\"version\":\"$version\""
          # No key: an auth error (exit 3), not a crash, and never a request.
          set +e
          STARGAZER_CONFIG_DIR="$RUNNER_TEMP/sg" "$bin" servers list --output json 2> err.json
          code=$?
          set -e
          cat err.json
          [ "$code" = 3 ]

      - name: Package
        shell: bash
        run: |
          name="stargazer-$TARGET"
          bin_dir="target/$TARGET/release"
          mkdir -p dist
          if [[ "$TARGET" == *windows* ]]; then
            asset="$name.zip"
            7z a "dist/$asset" "./$bin_dir/stargazer.exe" > /dev/null
          else
            asset="$name.tar.gz"
            tar -czf "dist/$asset" -C "$bin_dir" stargazer
          fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: stargazer-${{ matrix.target }}
          path: dist/*
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
